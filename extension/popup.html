<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f5f5f7;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --border: #d2d2d7;
      --primary: #0071e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    h2 { font-size: 1rem; margin: 0; }
    .status { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
    .entry {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.625rem 0.75rem; background: var(--card); border-radius: 6px;
      margin-bottom: 0.375rem; cursor: pointer;
    }
    .entry:hover { border-color: var(--primary); }
    .entry-site { font-weight: 500; font-size: 0.875rem; }
    .entry-user { font-size: 0.75rem; color: var(--text-secondary); }
    .input-group { margin-bottom: 0.75rem; }
    label { display: block; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.25rem; }
    input {
      width: 100%; padding: 0.5rem; border: 1px solid var(--border);
      border-radius: 4px; font-size: 0.875rem;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%; padding: 0.5rem; background: var(--primary); color: #fff;
      border: none; border-radius: 4px; font-size: 0.875rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); margin-top: 0.375rem; }
    .btn-settings {
      width: auto; padding: 0.25rem 0.5rem; background: none; color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: 4px; font-size: 0.875rem; cursor: pointer;
      float: right;
    }
    .btn-settings:hover { color: var(--primary); border-color: var(--primary); }
    .empty { font-size: 0.8125rem; color: var(--text-secondary); text-align: center; padding: 1rem; }
    .error { color: #ff3b30; font-size: 0.8125rem; margin-bottom: 0.5rem; }
    .success { color: #34c759; font-size: 0.8125rem; margin-bottom: 0.5rem; }
    .connected { color: #34c759; font-size: 0.75rem; }
    .disconnected { color: #ff3b30; font-size: 0.75rem; }
    .settings-tip { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.75rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header-row">
    <h2 id="app-title">Password Manager</h2>
  </div>
  <div id="status" class="status"></div>
  <div id="content"></div>

  <script src="popup.js"></script>
</body>
</html>
